<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Econ 223 Kit</title>
<meta name="description" content="Interactive companion to the ECON 223 presentation: Did globalization reduce global poverty (or did China)?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--card:#fff;--soft:#fbf8f2;--ink:#201c1c;--mute:#6a625d;--line:#e4dccd;--red:#c8102e;--red2:#8b0e20;--gold:#d4a94a;--gold2:#a77c1c;--slate:#4a5d8a;--rose:#e08b96;--teal:#1f7a78;--plum:#7b4a8c;--green:#2f7d4f;--shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);--fs:16px}
:root[data-theme=dark]{--bg:#161214;--card:#221b1e;--soft:#1c1618;--ink:#f3ece4;--mute:#b3a9a0;--line:#3a2f33;--red:#ff5a70;--red2:#ff8795;--gold:#e0b45a;--gold2:#e8c36e;--slate:#8fa3d6;--rose:#e08b96;--teal:#4cc1be;--plum:#c093d4;--green:#6fcf97;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
body.present{--fs:19px}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;font-weight:800;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--red);box-shadow:var(--shadow)}
.top-row{display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.5rem;cursor:pointer;margin-right:auto}
.brand b{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:800}
.brand b i{color:var(--red)}
.brand span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800}
.search{flex:1;min-width:180px;max-width:340px;display:flex;align-items:center;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;color:var(--mute);cursor:text}
.search kbd{margin-left:auto;font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 .3rem}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-weight:700;font-size:.85rem}
.pill:hover{border-color:var(--red)}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:.35rem 1.1rem;padding:.45rem 1rem .6rem;background:var(--soft);border-top:1px solid var(--line);align-items:center;font-size:.85rem}
.sw.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{background:rgba(212,169,74,.45)}}
.sw .lab{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800;margin-right:.35rem}
.sw .g{display:flex;align-items:center;gap:.2rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:.25rem .65rem;cursor:pointer;font-weight:700;font-size:.82rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.rng{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem}
.rng .rl{font-weight:700;min-width:max-content}
.rng input[type=range]{accent-color:var(--red);width:150px;max-width:44vw}
.rng output{font-variant-numeric:tabular-nums;min-width:3.2em;font-weight:800;color:var(--red2)}
main{max-width:1180px;margin:0 auto;padding:1rem 1rem 4rem}
.hero{padding:1.6rem 0 .6rem}
.hero .eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:800}
.hero h1{font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.08;margin:.3rem 0 .6rem}
.hero h1 em{color:var(--red)}
.hero p{max-width:62ch;color:var(--mute);margin:.2rem 0}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .4rem;align-items:center}
.filters .lab{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:800;margin:0 .3rem 0 .6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem;margin-top:.8rem}
.sec-h{grid-column:1/-1;display:flex;align-items:baseline;gap:.7rem;margin-top:1.2rem;padding-bottom:.35rem;border-bottom:1px solid var(--line)}
.sec-h h2{margin:0;font-size:1.25rem}
.sec-h span{color:var(--mute);font-size:.85rem}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:.8rem .9rem .75rem;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.3rem;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-top-color:var(--gold)}
.card:focus-visible{outline:3px solid var(--gold)}
.card .nm{display:flex;gap:.5rem;align-items:center;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card .nm .no{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 .4rem}
.card h3{margin:0;font-size:1.06rem;line-height:1.2}
.card p{margin:0;font-size:.88rem;color:var(--mute)}
.card .tags{margin-top:auto;display:flex;gap:.35rem;flex-wrap:wrap;padding-top:.35rem}
.tag{font-size:.68rem;font-weight:800;border-radius:4px;padding:.05rem .4rem;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.tag.t-chart{color:var(--slate)}.tag.t-sim{color:var(--teal)}.tag.t-game{color:var(--plum)}.tag.t-map{color:var(--green)}.tag.t-tool{color:var(--gold2)}
.star{position:absolute;right:.5rem;top:.35rem;border:0;background:transparent;font-size:1.1rem;cursor:pointer;color:var(--mute)}
.star.on{color:var(--gold2)}
.empty{grid-column:1/-1;padding:2rem;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:8px}
/* module view */
.mv-head{display:flex;flex-direction:column;gap:.3rem;padding:.6rem 0 .8rem;border-bottom:1px solid var(--line);margin-bottom:.9rem}
.mv-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.mv-bar .sp{flex:1}
.mv-head h2{margin:0;font-size:clamp(1.4rem,3vw,2rem)}
.mv-head .one{font-size:1.05rem;color:var(--mute);max-width:75ch;margin:0}
.mv-head .when{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;box-shadow:var(--shadow)}
.ctl{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin-bottom:.8rem}
.ctl .lab{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:800}
.row{display:flex;gap:1rem;flex-wrap:wrap}
.row>*{flex:1 1 320px;min-width:0}
.col{display:flex;flex-direction:column;gap:.6rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.8rem}
.stat{border-left:5px solid var(--red);background:var(--soft);padding:.45rem .7rem;border-radius:0 6px 6px 0}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:1.55rem;line-height:1.1;color:var(--red2)}
.stat span{font-size:.8rem;color:var(--mute)}
.stat.s2{border-color:var(--slate)}.stat.s2 b{color:var(--slate)}
.stat.s3{border-color:var(--gold)}.stat.s3 b{color:var(--gold2)}
.stat.s4{border-color:var(--ink)}.stat.s4 b{color:var(--ink)}
.note{background:var(--ink);color:var(--bg);border-left:5px solid var(--red);padding:.55rem .8rem;border-radius:0 6px 6px 0;font-size:.9rem;margin:.6rem 0}
.note.soft{background:var(--soft);color:var(--ink);border-left-color:var(--gold)}
.warn{background:rgba(212,169,74,.18);border:1px solid var(--gold);padding:.45rem .7rem;border-radius:6px;font-size:.85rem;margin:.5rem 0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;padding:.35rem .8rem;font-weight:800;cursor:pointer;font-size:.85rem}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft);color:var(--red);border-color:var(--red)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
input[type=text],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem}
textarea{width:100%;min-height:4.5rem}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.stage svg text,.chart text{font-family:Nunito,sans-serif;fill:var(--mute);font-size:11.5px}
.stage svg .ax,.chart .ax{stroke:var(--mute);stroke-width:1}
.stage svg .gr,.chart .gr{stroke:var(--line);stroke-width:1}
.stage svg .lbl-in,.chart .lbl-in{fill:var(--ink);font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:.35rem .55rem;border-radius:6px;z-index:5;display:none;white-space:nowrap;box-shadow:var(--shadow)}
.tip b{display:block}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.3rem;font-size:.8rem}
.legend button{border:0;background:transparent;cursor:pointer;display:flex;gap:.35rem;align-items:center;padding:0;font-weight:700}
.legend button.off{opacity:.35;text-decoration:line-through}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.panel{border:1px solid var(--line);border-radius:8px;padding:.7rem;background:var(--soft)}
.panel h4{margin:.1rem 0 .4rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.3rem .5rem;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
table.t tr.hl td{background:rgba(200,16,46,.08);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:.2rem;font-size:.68rem;font-weight:800;border:1px solid var(--gold);color:var(--gold2);background:rgba(212,169,74,.12);border-radius:999px;padding:0 .45rem;cursor:pointer;margin-left:.25rem;vertical-align:middle}
.chip.bad{border-color:var(--red);color:var(--red)}
.chip.ok{border-color:var(--green);color:var(--green)}
.pop{position:absolute;z-index:60;max-width:340px;background:var(--card);color:var(--ink);border:2px solid var(--gold);border-radius:8px;padding:.6rem .75rem;font-size:.82rem;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.pop b{display:block;margin-bottom:.15rem}
.mv-foot{margin-top:1rem;display:flex;flex-direction:column;gap:.6rem}
.srcrow{display:flex;gap:.2rem;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
.claim{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.claim>div{border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;background:var(--card)}
.claim .y{border-top:4px solid var(--green)}.claim .n{border-top:4px solid var(--red)}
.claim h4{margin:0 0 .25rem;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.devil{border:2px dashed var(--red);border-radius:8px;padding:.6rem .8rem;background:rgba(200,16,46,.06)}
.devil h4{margin:0 0 .2rem;color:var(--red);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.nav2{display:flex;justify-content:space-between;gap:.6rem}
abbr.gl{text-decoration:underline dotted var(--gold2);cursor:help;position:relative}
abbr.gl:hover::after,abbr.gl:focus::after{content:attr(data-tip);position:absolute;left:0;top:1.4em;background:var(--ink);color:var(--bg);font-size:.78rem;padding:.4rem .55rem;border-radius:6px;z-index:40;width:max-content;max-width:280px;font-weight:600;text-decoration:none;white-space:normal;line-height:1.35}
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal{width:min(620px,92vw);background:var(--card);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;border:2px solid var(--red)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:.9rem 1rem;font-size:1.1rem;outline:none}
.pal ul{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.pal li{padding:.5rem 1rem;cursor:pointer;display:flex;gap:.6rem;align-items:baseline;border-bottom:1px solid var(--line)}
.pal li.sel,.pal li:hover{background:var(--soft)}
.pal li .no{font-size:.7rem;font-weight:800;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 .35rem}
.pal li small{color:var(--mute);margin-left:auto;white-space:nowrap}
.hud{position:fixed;right:.8rem;bottom:.8rem;z-index:70;background:var(--ink);color:var(--bg);border-radius:10px;padding:.5rem .7rem;display:none;gap:.5rem;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.35)}
body.present .hud{display:flex}
.hud button{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:6px;padding:.2rem .55rem;cursor:pointer;font-weight:700;font-size:.8rem}
.hud button.on{background:var(--red);border-color:var(--red)}
.hud .time{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.6em;text-align:center}
#laser{position:fixed;width:18px;height:18px;border-radius:50%;background:rgba(255,30,60,.85);box-shadow:0 0 14px 6px rgba(255,30,60,.55);pointer-events:none;z-index:90;display:none;transform:translate(-50%,-50%)}
#ink{position:fixed;inset:0;z-index:65;display:none;touch-action:none;cursor:crosshair}
.cloud{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:center;justify-content:center;min-height:200px;padding:1rem}
.cloud span{font-family:'Playfair Display',serif;font-weight:800;line-height:1}
.drop{cursor:crosshair;touch-action:none;user-select:none}
.dot{display:inline-block;width:11px;height:11px;border-radius:2px;margin:1px}
.waffle{display:flex;flex-wrap:wrap;max-width:100%}
.sector{display:flex;flex-wrap:wrap;gap:3px;padding:.5rem;border:1px dashed var(--line);border-radius:8px;min-height:90px;transition:all .4s}
.worker{width:12px;height:12px;border-radius:50%;transition:all .6s}
.ribbon{display:flex;gap:.7rem;overflow-x:auto;padding:.5rem .2rem 1rem;scroll-snap-type:x proximity}
.ribbon .ev{flex:0 0 230px;scroll-snap-align:start;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:8px;padding:.6rem .7rem;background:var(--card)}
.ribbon .ev b.y{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--red2);display:block}
.ribbon .ev.dim{opacity:.55}
.drag{touch-action:none}
.scroll-x{overflow-x:auto}
@media (max-width:640px){.claim{grid-template-columns:1fr}.row>*{flex-basis:100%}.sw{gap:.3rem .7rem}}
@media print{.top,.hud,.nav2{display:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div class="hud" id="hud"></div>
<div id="laser"></div>
<canvas id="ink"></canvas>

/* ---------- OLS helpers ---------- */
function ols(xs, ys, w) {
  w = w || xs.map(() => 1);
  const sw = sum(w), mx = sum(xs.map((x, i) => x * w[i])) / sw, my = sum(ys.map((y, i) => y * w[i])) / sw;
  let sxx = 0, sxy = 0, syy = 0;
  xs.forEach((x, i) => { sxx += w[i] * (x - mx) ** 2; sxy += w[i] * (x - mx) * (ys[i] - my); syy += w[i] * (ys[i] - my) ** 2; });
  const b = sxy / (sxx || 1e-12), a = my - b * mx;
  return { a, b, r2: syy ? (sxy * sxy) / (sxx * syy) : 0, n: xs.length, mx, my };
}
function ols2(x1, x2, y) { // y ~ x1 + x2 (with intercept)
  const n = y.length, m1 = sum(x1) / n, m2 = sum(x2) / n, my = sum(y) / n;
  let s11 = 0, s22 = 0, s12 = 0, s1y = 0, s2y = 0;
  for (let i = 0; i < n; i++) { const a = x1[i] - m1, b = x2[i] - m2, c = y[i] - my; s11 += a * a; s22 += b * b; s12 += a * b; s1y += a * c; s2y += b * c; }
  const det = s11 * s22 - s12 * s12 || 1e-12;
  return { b1: (s1y * s22 - s2y * s12) / det, b2: (s2y * s11 - s1y * s12) / det };
}

/* ---------- glossary ---------- */
const GLOSS = {
  'PPP': 'Purchasing power parity: converts local money into "international dollars" that buy the same basket everywhere.',
  'poverty line': 'Daily income/consumption below which someone counts as poor. Here mostly $3 a day in 2021 PPP prices.',
  'headcount': 'The number of people below the poverty line (not the share).',
  'Gini': 'Inequality index from 0 (everyone equal) to 1 (one person has everything).',
  'Lorenz': 'Curve showing the cumulative share of income held by the poorest p% of people.',
  'opportunity cost': 'What you give up to get one more unit of something.',
  'comparative advantage': 'Being the lower opportunity-cost producer of a good, even if you are worse at everything.',
  'Heckscher–Ohlin': 'Trade theory: countries export goods that use their abundant factor intensively.',
  'Stolper–Samuelson': 'Theorem: a rise in a good\'s price raises the real return of the factor used intensively in it and lowers the other.',
  'terms of trade': 'The price of exports relative to imports.',
  'deadweight loss': 'Welfare lost because a tax or tariff stops trades that would benefit both sides.',
  'hukou': 'China\'s household registration system, which long limited where rural people could live and work.',
  'household responsibility system': 'Post-1978 farm reform: families farm contracted land and keep output beyond a quota.',
  'SEZ': 'Special Economic Zone: a region with different, market-friendly rules to attract trade and investment.',
  'WTO': 'World Trade Organization. China joined in December 2001.',
  'elasticity': 'Percent change in one thing per percent change in another.',
  'counterfactual': 'What would have happened if something had been different.',
  'omitted-variable bias': 'Error in an estimate because a related variable was left out of the model.',
  'difference-in-differences': 'Compare change over time in a treated group with change in a control group.',
  'Pareto': 'An allocation is Pareto-improving if someone gains and no one loses.'
};
function glossify(root) {
  const terms = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
  const re = new RegExp('\\b(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'i');
  const used = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('svg,abbr,button,input,select,textarea,.tip,output,option,script,style') || !n.nodeValue.trim() ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const m = n.nodeValue.match(re); if (!m) return;
    const key = terms.find(t => t.toLowerCase() === m[1].toLowerCase()); if (used.has(key)) return; used.add(key);
    const i = m.index, a = n.nodeValue.slice(0, i), b = n.nodeValue.slice(i + m[1].length);
    const ab = h('abbr', { class: 'gl', tabindex: 0, 'data-tip': GLOSS[key] }, m[1]);
    n.replaceWith(document.createTextNode(a), ab, document.createTextNode(b));
  });
}

function regionSeries(code, L) {
  if (code === 'CHN') return S_china(L);
  if (code === 'EAS*') return S_sub(S_region('EAS', L), S_china(L));
  if (code === 'OTH') return S_sum(S_sum(S_region('LCN', L), S_region('ECS', L)), S_region('NAC', L));
  return S_region(code, L);
}

/* interpolation on a series of [x,y] */
function interp(pts, x) {
  for (let i = 0; i < pts.length - 1; i++) if (x >= pts[i][0] && x <= pts[i + 1][0]) { const t = (x - pts[i][0]) / (pts[i + 1][0] - pts[i][0]); return pts[i][1] * (1 - t) + pts[i + 1][1] * t; }
  return null;
}

/* ---------- shared: tug-of-war bar ---------- */
function tugBar(parent, o) {
  const bar = h('div', { style: { position: 'relative', height: '92px', margin: '2.3rem 14px 2.6rem', borderRadius: '12px', border: '1px solid var(--line)', background: 'linear-gradient(90deg,var(--slate),var(--soft) 50%,var(--red))', touchAction: 'none', cursor: o.interactive ? 'ew-resize' : 'default', userSelect: 'none' } });
  bar.append(h('div', { style: { position: 'absolute', left: '4px', top: '-1.8rem', fontWeight: 800, color: 'var(--slate)' } }, '← Globalization did it'), h('div', { style: { position: 'absolute', right: '4px', top: '-1.8rem', fontWeight: 800, color: 'var(--red)' } }, 'China did it →'));
  const layer = h('div', { style: { position: 'absolute', inset: 0 } });
  bar.append(layer); parent.append(bar);
  if (o.interactive) {
    let down = false;
    const mv = ev => { const r = bar.getBoundingClientRect(); o.onMove(clamp((ev.clientX - r.left) / r.width * 100, 0, 100)); };
    bar.addEventListener('pointerdown', ev => { down = true; bar.setPointerCapture(ev.pointerId); mv(ev); });
    bar.addEventListener('pointermove', ev => { if (down) mv(ev); });
    bar.addEventListener('pointerup', () => { down = false; });
  }
  const pin = (p, txt, color, down) => h('div', { style: { position: 'absolute', left: p + '%', top: 0, bottom: 0, transform: 'translateX(-50%)', pointerEvents: 'none' } }, h('div', { style: { width: '4px', height: '100%', background: color, margin: '0 auto', borderRadius: '2px' } }), h('b', { style: { position: 'absolute', left: '50%', transform: 'translateX(-50%)', [down ? 'bottom' : 'top']: '-1.5rem', color, fontSize: '.78rem', whiteSpace: 'nowrap' } }, txt));
  return {
    bar,
    render(s) {
      layer.innerHTML = '';
      (s.votes || []).forEach(v => layer.append(h('div', { style: { position: 'absolute', left: v + '%', top: '8px', width: '3px', height: '18px', background: 'rgba(0,0,0,.35)', borderRadius: '2px' } })));
      if (s.before != null) layer.append(pin(s.before, 'BEFORE ' + Math.round(s.before), 'var(--gold2)', true));
      if (s.after != null) layer.append(pin(s.after, 'AFTER ' + Math.round(s.after), 'var(--ink)', false));
      if (s.pos != null) layer.append(h('div', { style: { position: 'absolute', left: s.pos + '%', top: '33px', width: '28px', height: '28px', borderRadius: '50%', background: 'var(--card)', border: '4px solid var(--ink)', transform: 'translateX(-50%)', boxShadow: 'var(--shadow)' } }));
    }
  };
}

   ===================================================================== */
const RIC0 = { a1: 6, w1: 2, a2: 3, w2: 3, L: 100 };
function ricardo(P, t) {
  const oc1 = P.w1 / P.a1, oc2 = P.w2 / P.a2, lo = Math.min(oc1, oc2), hi = Math.max(oc1, oc2), p = lo + (hi - lo) * t, L = P.L;
  return { oc1, oc2, lo, hi, p, L, same: Math.abs(oc1 - oc2) < 1e-9, homeCloth: oc1 < oc2, aut1: { c: P.a1 * L / 2, w: P.w1 * L / 2 }, aut2: { c: P.a2 * L / 2, w: P.w2 * L / 2 }, cmax1: P.a1 * L, wmax1: P.w1 * L, cmax2: P.a2 * L, wmax2: P.w2 * L };
}
function ricControls(ctl, P, on) {
  [['Home cloth / worker', 'a1'], ['Home wheat / worker', 'w1'], ['Partner cloth / worker', 'a2'], ['Partner wheat / worker', 'w2']].forEach(([l, k]) => ctl.append(range(l, { min: 1, max: 10, step: 0.5, value: P[k], fmt: v => v.toFixed(1) }, v => { P[k] = v; on(); })));
}
function ppfSvg(title, cm, wm, aut, spec, p, xmax, ymax, gainTxt) {
  const W = 400, H = 300, m = { l: 44, r: 12, t: 26, b: 34 };
  const sx = x => m.l + x / xmax * (W - m.l - m.r), sy = y => H - m.b - y / ymax * (H - m.t - m.b);
  const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, style: { width: '100%' } });
  s.append(sv('text', { x: m.l, y: 16, class: 'lbl-in', style: { fontSize: '13px' } }, title));
  niceTicks(0, ymax, 4).forEach(t => s.append(sv('line', { class: 'gr', x1: m.l, x2: W - m.r, y1: sy(t), y2: sy(t) }), sv('text', { x: m.l - 5, y: sy(t) + 4, 'text-anchor': 'end' }, t)));
  niceTicks(0, xmax, 5).forEach(t => s.append(sv('text', { x: sx(t), y: H - m.b + 15, 'text-anchor': 'middle' }, t)));
  s.append(sv('line', { class: 'ax', x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b }), sv('line', { class: 'ax', x1: m.l, x2: m.l, y1: m.t, y2: H - m.b }));
  s.append(sv('text', { x: (m.l + W - m.r) / 2, y: H - 3, 'text-anchor': 'middle' }, 'Cloth'), sv('text', { transform: `translate(11 ${(m.t + H - m.b) / 2}) rotate(-90)`, 'text-anchor': 'middle' }, 'Wheat'));
  s.append(sv('line', { x1: sx(0), y1: sy(wm), x2: sx(cm), y2: sy(0), stroke: C.slate, 'stroke-width': 3 }));
  // trade line through specialisation point with slope -p (wheat per cloth)
  const [x0, y0] = spec === 'cloth' ? [cm, 0] : [0, wm];
  const pts = [[0, y0 + p * x0], [xmax, y0 + p * (x0 - xmax)]].filter(Boolean);
  const xa = 0, ya = y0 + p * (x0 - xa), yb0 = 0, xb = x0 + (y0 - yb0) / p;
  s.append(sv('clipPath', { id: 'cl' + title.length }, sv('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b })));
  s.append(sv('line', { x1: sx(xa), y1: sy(ya), x2: sx(Math.min(xmax, xb)), y2: sy(Math.max(0, ya - p * Math.min(xmax, xb))), stroke: C.red, 'stroke-width': 3, 'stroke-dasharray': '7 4', 'clip-path': `url(#cl${title.length})` }));
  s.append(sv('circle', { cx: sx(x0), cy: sy(y0), r: 6, fill: C.red }), sv('text', { x: sx(x0) + (spec === 'cloth' ? -6 : 8), y: sy(y0) + (spec === 'cloth' ? -9 : 14), 'text-anchor': spec === 'cloth' ? 'end' : 'start', class: 'lbl-in', fill: C.red }, 'specialise'));
  s.append(sv('circle', { cx: sx(aut.c), cy: sy(aut.w), r: 7, fill: C.ink }), sv('text', { x: sx(aut.c) + 10, y: sy(aut.w) - 8, class: 'lbl-in' }, 'autarky'));
  return s;
}
function gainFor(R, which) {
  const home = which === 1, spec = (home ? R.homeCloth : !R.homeCloth) ? 'cloth' : 'wheat';
  const aut = home ? R.aut1 : R.aut2, cm = home ? R.cmax1 : R.cmax2, wm = home ? R.wmax1 : R.wmax2;
  if (spec === 'cloth') return { spec, aut, cm, wm, good: 'wheat', from: aut.w, to: R.p * (cm - aut.c), at: `same cloth (${aut.c.toFixed(0)})` };
  return { spec, aut, cm, wm, good: 'cloth', from: aut.c, to: (wm - aut.w) / R.p, at: `same wheat (${aut.w.toFixed(0)})` };
}

M({

  kw: 'terms of trade gains split price band', src: ['theory'],
  shows: 'Who gets the larger share of the gains depends on where the price lands inside the band set by opportunity costs.', limits: 'Gains are measured in % of each country\'s autarky income valued at the trade price; same illustrative parameters as the Ricardo sandbox.',
  devil: 'In reality the price band is set by world markets and bargaining power, not by a slider.',
  mount(host, ctx) {
    const P = { ...RIC0 }; let t = 0.5; const { ctl, viz, out } = std(host);
    ricControls(ctl, P, draw); const ch = lineChart(viz, { series: [] });
    function gains(R, p) {
      const val = (c, w) => c * p + w, a1 = val(R.aut1.c, R.aut1.w), a2 = val(R.aut2.c, R.aut2.w);
      const s1 = R.homeCloth ? p * R.cmax1 : R.wmax1, s2 = R.homeCloth ? R.wmax2 : p * R.cmax2;
      return [(s1 / a1 - 1) * 100, (s2 / a2 - 1) * 100];
    }
    function draw() {
      const R0 = ricardo(P, 0.5); if (R0.same) { viz.innerHTML = ''; viz.append(warn('Same opportunity costs: no gains from trade.')); setStats(out, []); return; }
      const ps = Array.from({ length: 41 }, (_, i) => R0.lo + (R0.hi - R0.lo) * i / 40);
      const g = ps.map(p => gains(R0, p));
      ch.update({ series: [{ name: 'Home gain', color: C.red, pts: ps.map((p, i) => [p, g[i][0]]), w: 3 }, { name: 'Partner gain', color: C.slate, pts: ps.map((p, i) => [p, g[i][1]]), w: 3 }], xmin: R0.lo, xmax: R0.hi, ymin: 0, xfmt: v => v.toFixed(2), yfmt: v => v.toFixed(0) + '%', xtitle: 'Price of cloth in wheat', ytitle: 'Gain from trade (% of autarky income)', drag: { value: R0.lo + (R0.hi - R0.lo) * t, min: R0.lo, max: R0.hi, snap: (R0.hi - R0.lo) / 100, fmt: v => v.toFixed(2), onChange: v => { t = (v - R0.lo) / (R0.hi - R0.lo); stats(R0); } }, label: 'Gains from trade vs price' });
      stats(R0);
    }
    function stats(R0) { const p = R0.lo + (R0.hi - R0.lo) * t, g = gains(R0, p); setStats(out, [['+' + g[0].toFixed(0) + '%', 'Home gain at price ' + p.toFixed(2), ''], ['+' + g[1].toFixed(0) + '%', 'Partner gain', 's2'], [g[0] > g[1] ? 'Home' : 'Partner', 'who captures more of the gains', 's3']]); }
    draw();
  }
});

M({
  n: 57, slide: 8, when: 'After slide 8', type: 'sim', title: 'Edgeworth box',
  one: 'Drag a point inside the box to split two goods between two people and see when both can be made better off by trading.',
  kw: 'edgeworth box pareto indifference curves contract curve', src: ['theory'],
  shows: 'The shaded lens is every swap that makes both parties better off; trade continues until the point reaches the contract curve.', limits: 'Cobb–Douglas preferences and a fixed total endowment; no money, production or market prices.',
  devil: 'Pareto improvements ignore who gains most; moving along the contract curve changes the distribution without any efficiency gain.',
  mount(host, ctx) {
    let a = 0.5, b = 0.5, px = 3, py = 7; const Wd = 10, Hd = 10; const { ctl, viz, out } = std(host);
    ctl.append(range('A\'s taste for good X', { min: 0.2, max: 0.8, step: 0.05, value: a, fmt: v => v.toFixed(2) }, v => { a = v; draw(); }), range('B\'s taste for good X', { min: 0.2, max: 0.8, step: 0.05, value: b, fmt: v => v.toFixed(2) }, v => { b = v; draw(); }));
    const holder = h('div', { style: { display: 'flex', justifyContent: 'center' } }); viz.append(holder);
    const uA = (x, y) => Math.pow(x, a) * Math.pow(y, 1 - a), uB = (x, y) => Math.pow(Wd - x, b) * Math.pow(Hd - y, 1 - b);
    function draw() {
      const S_ = 440, m = 44, sx = x => m + x / Wd * S_, sy = y => m + S_ - y / Hd * S_;
      const svg = sv('svg', { viewBox: `0 0 ${S_ + 2 * m} ${S_ + 2 * m}`, style: { width: 'min(540px,100%)', touchAction: 'none' } });
      svg.append(sv('rect', { x: m, y: m, width: S_, height: S_, fill: 'var(--soft)', stroke: C.ink }));
      const UA = uA(px, py), UB = uB(px, py), N = 44;
      for (let j = 0; j < N; j++) { let run = null; for (let i = 0; i <= N; i++) { const x = (i + 0.5) / N * Wd, y = (j + 0.5) / N * Hd, ok = i < N && uA(x, y) > UA && uB(x, y) > UB; if (ok && run == null) run = i; if (!ok && run != null) { svg.append(sv('rect', { x: sx(run / N * Wd), y: sy((j + 1) / N * Hd), width: (i - run) / N * S_, height: S_ / N + 0.6, fill: C.gold, 'fill-opacity': 0.55 })); run = null; } } }
      const al = a / (1 - a), be = b / (1 - b); let cc = '';
      for (let i = 1; i < 100; i++) { const x = i / 100 * Wd, y = be * x * Hd / (al * (Wd - x) + be * x); cc += (cc ? 'L' : 'M') + sx(x) + ',' + sy(y); }
      svg.append(sv('path', { d: cc, fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-dasharray': '2 5' }));
      const ic = (f, c) => { let d = '', pen = false; for (let i = 1; i <= 120; i++) { const x = i / 120 * Wd, y = f(x); if (y == null || y < 0 || y > Hd || !isFinite(y)) { pen = false; continue; } d += (pen ? 'L' : 'M') + sx(x) + ',' + sy(y); pen = true; } svg.append(sv('path', { d, fill: 'none', stroke: c, 'stroke-width': 3 })); };
      ic(x => Math.pow(UA / Math.pow(x, a), 1 / (1 - a)), C.red);
      ic(x => Wd - x <= 0 ? null : Hd - Math.pow(UB / Math.pow(Wd - x, b), 1 / (1 - b)), C.slate);
      svg.append(sv('text', { x: m, y: m + S_ + 28, class: 'lbl-in', fill: C.red }, 'A origin (bottom-left)  →  X'), sv('text', { x: m + S_, y: 26, 'text-anchor': 'end', class: 'lbl-in', fill: C.slate }, 'B origin (top-right)'));
      svg.append(sv('circle', { cx: sx(px), cy: sy(py), r: 9, fill: C.ink, style: { cursor: 'grab' } }));
      let down = false; const mv = ev => { const r = svg.getBoundingClientRect(), vb = S_ + 2 * m; px = clamp((((ev.clientX - r.left) / r.width * vb) - m) / S_ * Wd, 0.3, Wd - 0.3); py = clamp((m + S_ - (ev.clientY - r.top) / r.height * vb) / S_ * Hd, 0.3, Hd - 0.3); draw(); };
      svg.addEventListener('pointerdown', ev => { down = true; svg.setPointerCapture(ev.pointerId); mv(ev); }); svg.addEventListener('pointermove', ev => { if (down) mv(ev); }); svg.addEventListener('pointerup', () => { down = false; });
      holder.innerHTML = ''; holder.append(svg);
      const cy = be * px * Hd / (al * (Wd - px) + be * px), gap = Math.abs(cy - py);
      setStats(out, [[uA(px, py).toFixed(2), 'A\'s utility', ''], [uB(px, py).toFixed(2), 'B\'s utility', 's2'], [gap < 0.15 ? 'On the contract curve' : 'Gains from trade remain', 'efficiency check', gap < 0.15 ? 's3' : 's4']]);
    }
    draw();
    host.append(note('Red and blue curves are indifference curves through the point. The gold lens between them is every swap that makes both better off. The dotted line is the contract curve.', true));
  }
});

function scatterLab(host, ctx, cfg) {
  const XV = {
    dtrade: { l: 'Change in trade/GDP (percentage points)', f: (k, a, b) => { const t = D.trade[k]; return t && t[yi(a)] != null && t[yi(b)] != null ? t[yi(b)] - t[yi(a)] : null; }, fmt: v => fSign(v, 0) },
    trade1: { l: 'Trade/GDP at end year (%)', f: (k, a, b) => { const t = D.trade[k]; return t && t[yi(b)] != null ? t[yi(b)] : null; }, fmt: v => v + '%' },
    pov0: { l: 'Poverty rate at start year (%)', f: (k, a) => rt(k, a), fmt: v => v + '%' },
    pop: { l: 'Population at end year (millions, log scale)', f: (k, a, b) => pp(k, b), log: true, fmt: v => v >= 1000 ? (v / 1000) + 'B' : v + 'M' }
  };
  const YV = { dRate: { l: 'Fall in poverty rate (percentage points)', f: (k, a, b) => { const x = rt(k, a), y = rt(k, b); return x == null || y == null ? null : x - y; }, fmt: v => v.toFixed(0) }, dPeople: { l: 'Fall in people in poverty (millions)', f: (k, a, b) => { const s = S_cty(k, S.line), x = at(s.p, a), y = at(s.p, b); return x == null || y == null ? null : x - y; }, fmt: v => v.toFixed(0) } };
  const rt = (k, y) => { const v = D.K[k].hc[LK(S.line)][yi(y)]; return v < 0 ? null : v / 100; };
  const pp = (k, y) => { const v = D.K[k].pop[yi(y)]; return v < 0 ? null : v / 1000; };
  let xk = cfg.x, yk = cfg.y, weighted = cfg.weighted ?? true; const ex = new Set(cfg.exclude || []);
  const { ctl, viz, out } = std(host);
  ctl.append(lab('x'), sel(Object.entries(XV).map(([k, v]) => [k, v.l]), xk, v => { xk = v; draw(); }), lab('y'), sel(Object.entries(YV).map(([k, v]) => [k, v.l]), yk, v => { yk = v; draw(); }), chk('Weight by population', weighted, v => { weighted = v; draw(); }),
    btn('Remove China', () => { ex.add('CHN'); draw(); }, 'ghost'), btn('Remove China + India', () => { ex.add('CHN'); ex.add('IND'); draw(); }, 'ghost'), btn('Reset', () => { ex.clear(); draw(); }, 'ghost'));
  const sc = scatter(viz, { pts: [] });
  function fit(keys, P) {
    const xs = [], ys = [], w = [];
    keys.forEach(k => { const p = P.find(q => q.id === k); if (p) { xs.push(XV[xk].log ? Math.log10(p.x) : p.x); ys.push(p.y); w.push(weighted ? p.pop : 1); } });
    return xs.length >= 4 ? ols(xs, ys, w) : null;
  }
  function draw() {
    const a = S.y0, b = S.y1, P = [];
    Object.keys(D.K).forEach(k => { const x = XV[xk].f(k, a, b), y = YV[yk].f(k, a, b), pop = pp(k, b); if (x != null && y != null && pop != null && isFinite(x) && isFinite(y) && (!XV[xk].log || x > 0)) P.push({ id: k, x, y, pop }); });
    const incl = P.filter(p => !ex.has(p.id)), allK = P.map(p => p.id), noC = allK.filter(k => k !== 'CHN'), noCI = noC.filter(k => k !== 'IND');
    const cur = fit(incl.map(p => p.id), P), full = fit(allK, P);
    const xmin = Math.min(...P.map(p => p.x)), xmax = Math.max(...P.map(p => p.x));
    const lineOf = (f, c, dash, lbl) => f ? { x1: xmin, x2: xmax, y1: f.a + f.b * (XV[xk].log ? Math.log10(xmin) : xmin), y2: f.a + f.b * (XV[xk].log ? Math.log10(xmax) : xmax), color: c, dash, label: lbl } : null;
    const lines = [lineOf(cur, C.ink, null, 'current fit')]; if (ex.size && full) lines.push(lineOf(full, C.gold2, '6 4', 'all countries'));
    sc.update({
      pts: P.map(p => ({ id: p.id, x: p.x, y: p.y, label: D.K[p.id].n, r: 3 + 21 * Math.sqrt(p.pop / 1500), color: p.id === 'CHN' ? C.red : p.id === 'IND' ? C.gold2 : C.slate, dim: ex.has(p.id), ring: p.id === 'CHN', tip: `<b>${D.K[p.id].n}</b>${XV[xk].l.split(' (')[0]}: ${p.x.toFixed(1)}<br>${YV[yk].l.split(' (')[0]}: ${p.y.toFixed(1)}<br>Population: ${fM(p.pop)}<br><i>Click to ${ex.has(p.id) ? 'include' : 'exclude'}</i>` })),
      lines: lines.filter(Boolean), xt: XV[xk].l, yt: YV[yk].l, logx: !!XV[xk].log, xticks: [1, 10, 100, 1000], xfmt: XV[xk].fmt, yfmt: YV[yk].fmt, xmin: XV[xk].log ? Math.max(0.1, xmin * 0.7) : undefined, xmax: XV[xk].log ? xmax * 1.5 : undefined, showLabel: p => ['CHN', 'IND', 'VNM', 'BGD', 'NGA', 'IDN', 'ETH', 'PAK', 'BRA', 'MEX'].includes(p.id), onClick: p => { ex.has(p.id) ? ex.delete(p.id) : ex.add(p.id); draw(); }, label: 'Country scatter'
    });
    const row = (n, f) => [f ? (f.b >= 0 ? '+' : '') + f.b.toFixed(2) : 'n/a', `${n}${f ? `  (R² ${f.r2.toFixed(2)}, n=${f.n})` : ''}`];
    setStats(out, [row('slope, current selection', cur).concat(''), row('slope, all countries', full).concat('s2'), row('slope, excluding China', fit(noC, P)).concat('s3'), row('slope, excluding China + India', fit(noCI, P)).concat('s4')]);
  }
  ctx.watch(draw); draw();
  host.append(note(cfg.hint, true));
}

  document.body.append(palEl); inp.focus();
  function score(m, q) { if (!q) return 1; const hay = [m.n, m.title, m.one, m.kw || '', SLIDES[m.slide], 'slide ' + m.slide, m.type, m.when].join(' ').toLowerCase(); let s = 0; for (const t of q.toLowerCase().split(/\s+/).filter(Boolean)) { if (m.title.toLowerCase().includes(t)) s += 4; else if (hay.includes(t)) s += 1; else return 0; if (String(m.n) === t.replace('#', '')) s += 10; } return s; }
  function paint() { const q = inp.value.trim(); items = MODS.map(m => [m, score(m, q)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]); selIdx = Math.min(selIdx, Math.max(0, items.length - 1)); ul.innerHTML = ''; items.forEach((m, i) => ul.append(h('li', { class: i === selIdx ? 'sel' : '', onclick: () => { closePalette(); go('m' + m.n); } }, h('span', { class: 'no' }, '#' + m.n), h('b', null, m.title), h('small', null, m.slide === 0 ? 'Kit' : 'Slide ' + m.slide)))); if (!items.length) ul.append(h('li', null, 'No match')); }
  inp.addEventListener('input', () => { selIdx = 0; paint(); });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { selIdx = Math.min(items.length - 1, selIdx + 1); paint(); e.preventDefault(); } else if (e.key === 'ArrowUp') { selIdx = Math.max(0, selIdx - 1); paint(); e.preventDefault(); } else if (e.key === 'Enter' && items[selIdx]) { const m = items[selIdx]; closePalette(); go('m' + m.n); } else if (e.key === 'Escape') { e.stopPropagation(); closePalette(); } });
  paint();
}
function closePalette() { if (palEl) { palEl.remove(); palEl = null; } }

/* ---------- presenter tools ---------- */
const PRES = { laser: false, pen: false, run: false, secs: 0, tm: null };
const hud = $('#hud'), laser = $('#laser'), ink = $('#ink'), ictx = ink.getContext('2d');
function buildHud() {
  const time = h('span', { class: 'time' }, '00:00');
  const fmt = () => { time.textContent = String(Math.floor(PRES.secs / 60)).padStart(2, '0') + ':' + String(PRES.secs % 60).padStart(2, '0'); };
  const bT = h('button', { type: 'button', onclick: () => { PRES.run = !PRES.run; clearInterval(PRES.tm); if (PRES.run) PRES.tm = setInterval(() => { PRES.secs++; fmt(); }, 1000); bT.textContent = PRES.run ? '❚❚' : '▶'; } }, '▶');
  const bR = h('button', { type: 'button', onclick: () => { PRES.secs = 0; fmt(); } }, '↺');
  const bL = h('button', { type: 'button', onclick: () => { PRES.laser = !PRES.laser; bL.classList.toggle('on', PRES.laser); laser.style.display = PRES.laser ? 'block' : 'none'; } }, 'Laser');
  const bP = h('button', { type: 'button', onclick: () => { PRES.pen = !PRES.pen; bP.classList.toggle('on', PRES.pen); ink.style.display = PRES.pen ? 'block' : 'none'; sizeInk(); } }, 'Pen');
  const bC = h('button', { type: 'button', onclick: () => ictx.clearRect(0, 0, ink.width, ink.height) }, 'Clear');
  const bX = h('button', { type: 'button', onclick: () => togglePresent(false) }, 'Exit');
  hud.append(time, bT, bR, bL, bP, bC, bX);
  addEventListener('pointermove', e => { if (PRES.laser) { laser.style.left = e.clientX + 'px'; laser.style.top = e.clientY + 'px'; } });
  let drawing = false, lx = 0, ly = 0;
  ink.addEventListener('pointerdown', e => { drawing = true; ink.setPointerCapture(e.pointerId); lx = e.clientX; ly = e.clientY; });
  ink.addEventListener('pointermove', e => { if (!drawing) return; ictx.strokeStyle = '#ff2d4a'; ictx.lineWidth = 5; ictx.lineCap = 'round'; ictx.beginPath(); ictx.moveTo(lx, ly); ictx.lineTo(e.clientX, e.clientY); ictx.stroke(); lx = e.clientX; ly = e.clientY; });
  ink.addEventListener('pointerup', () => { drawing = false; });
  hud._reset = () => { PRES.laser = PRES.pen = false; laser.style.display = ink.style.display = 'none'; bL.classList.remove('on'); bP.classList.remove('on'); };
}
function sizeInk() { if (ink.width !== innerWidth || ink.height !== innerHeight) { ink.width = innerWidth; ink.height = innerHeight; } }
function togglePresent(force) {
  const on = force == null ? !document.body.classList.contains('present') : force;
  document.body.classList.toggle('present', on); presBtn.classList.toggle('on', on);
  if (!on && hud._reset) hud._reset();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  const t = e.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if (e.key === 'Escape') { if (palEl) closePalette(); else if (popEl) closePop(); else if (current) go(''); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); }
  else if (e.key === 'p' || e.key === 'P') togglePresent();
  else if (e.key === 'd' || e.key === 'D') setS({ devil: !S.devil });
  else if (e.key === 'h' || e.key === 'H') go('');
  else if (current && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const i = MODS.indexOf(current.mod), n = MODS[i + (e.key === 'ArrowRight' ? 1 : -1)]; if (n) go('m' + n.n); }
});
addEventListener('resize', () => { if (PRES.pen) sizeInk(); });

/* ---------- start ---------- */
buildHeader(); buildHud(); renderSwitches(); renderRoute();
</script>
